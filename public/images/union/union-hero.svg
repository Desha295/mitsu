<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D5FB8;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#2E9E5B;stop-opacity:0.10" />
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#F7F8FA"/>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>

  <!-- Abstract connected-node pattern, echoing the MITSU logo's network motif -->
  <g stroke="#2E9E5B" stroke-width="2" opacity="0.5">
    <line x1="420" y1="220" x2="520" y2="270" />
    <line x1="520" y1="270" x2="480" y2="340" />
    <line x1="480" y1="340" x2="600" y2="360" />
    <line x1="600" y1="360" x2="680" y2="290" />
    <line x1="680" y1="290" x2="780" y2="320" />
    <line x1="520" y1="270" x2="620" y2="250" />
    <line x1="620" y1="250" x2="680" y2="290" />
    <line x1="480" y1="340" x2="560" y2="410" />
    <line x1="600" y1="360" x2="620" y2="430" />
  </g>
  <g fill="#1D5FB8">
    <circle cx="420" cy="220" r="8" />
    <circle cx="520" cy="270" r="10" />
    <circle cx="480" cy="340" r="7" />
    <circle cx="600" cy="360" r="9" />
    <circle cx="680" cy="290" r="8" />
    <circle cx="780" cy="320" r="7" />
    <circle cx="620" cy="250" r="6" />
    <circle cx="560" cy="410" r="6" />
    <circle cx="620" cy="430" r="7" />
  </g>

  <text x="600" y="520" font-size="22" fill="#5B6270" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">
    Official Student Union Photo Coming Soon
  </text>
</svg>
