  <rect x="520" y="265" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
  <rect x="575" y="265" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
  <rect x="410" y="320" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
  <rect x="465" y="320" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
  <rect x="520" y="320" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
  <rect x="575" y="320" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
  <polygon points="400,200 525,80 650,200" fill="#1A252F"/>
  
  <!-- Building 3 -->
  <rect x="750" y="300" width="180" height="150" fill="#2C3E50"/>
  <rect x="760" y="310" width="35" height="35" fill="#87CEEB" opacity="0.8"/>
  <rect x="805" y="310" width="35" height="35" fill="#87CEEB" opacity="0.8"/>
  <rect x="850" y="310" width="35" height="35" fill="#87CEEB" opacity="0.8"/>
  <rect x="760" y="355" width="35" height="35" fill="#87CEEB" opacity="0.8"/>
