  <rect x="210" y="310" width="40" height="40" fill="#87CEEB" opacity="0.8"/>
  <polygon points="100,250 200,150 300,250" fill="#1A252F"/>
  
  <!-- Building 2 -->
  <rect x="400" y="200" width="250" height="250" fill="#34495E"/>
  <rect x="410" y="210" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
  <rect x="465" y="210" width="45" height="45" fill="#87CEEB" opacity="0.8"/>
